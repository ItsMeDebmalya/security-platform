[project]
name = "security-platform"
version = "0.1.0"
description = "Evidence-first security scanning tools"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "python-ulid>=3.0",
    "dnspython>=2.9",  # >=2.9: GHSA-45c3-73f7-pv4m, CPU exhaustion parsing crafted DNS wire data
    "httpx>=0.27",
    "typer>=0.15",
    "cryptography>=50.0.0",
    "idna>=3.10",  # ADR-030: UTS-46 hostname encoding, as browsers do
]

[project.scripts]
scan = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "referencing>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scanners", "cli"]

[tool.ruff]
line-length = 100
target-version = "py313"
# The document set is the spec. Never reformat it.
# Archived live-run evidence is checksummed (raw-manifest.sha256); reformatting
# it would break the manifest. Its scripts are kept as they ran.
extend-exclude = ["docs", "corpus/crosscheck/email-live"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# agent/ is written to a Python 3.6 syntax floor (spec 3.1, agent/version.py). UP would
# rewrite typing.List[str] to list[str] and drop the 3.6-valid idioms (3.9+ syntax);
# the floor test in tests/agent enforces the dialect instead. Shim: 2.7 syntax.
"agent/**" = ["UP"]
# typer declares CLI options as function-call defaults; that is its whole API.
"cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
# Spec 3.2 asks for python_version 3.8 on agent/, but the installed mypy refuses anything
# below 3.10 and python_version is not a per-module option; the 3.6 floor is the AST test.
# The entry shim is Python 2.7 syntax by design (no annotations), so it is not type-checked.
exclude = ["agent/__main__\\.py$"]
files = [
    "core",
    "cli",
    "scanners",
    "agent",
    "corpus/lab/tls_capture.py",
    "corpus/lab/testssl_capture.py",
    "corpus/lab/scan.py",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # We name obsolete protocol versions on purpose - detecting a server that
    # still offers TLS 1.0/1.1 is the job, so their deprecation is expected.
    "ignore:ssl.TLSVersion.TLSv1.*is deprecated:DeprecationWarning",
    "ignore:ssl.PROTOCOL_TLS.*is deprecated:DeprecationWarning",
]
