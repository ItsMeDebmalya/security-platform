[project]
name = "security-platform"
version = "0.1.0"
description = "Evidence-first security scanning tools"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "python-ulid>=3.0",
    "dnspython>=2.7",
    "httpx>=0.27",
    "typer>=0.15",
    "cryptography>=50.0.0",
]

[project.scripts]
scan = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "referencing>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scanners", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The document set is the spec. Never reformat it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as function-call defaults; that is its whole API.
"cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "cli", "scanners"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # We name obsolete protocol versions on purpose - detecting a server that
    # still offers TLS 1.0/1.1 is the job, so their deprecation is expected.
    "ignore:ssl.TLSVersion.TLSv1.*is deprecated:DeprecationWarning",
    "ignore:ssl.PROTOCOL_TLS.*is deprecated:DeprecationWarning",
]
