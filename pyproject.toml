[project]
name = "security-platform"
version = "0.1.0"
description = "Evidence-first security scanning tools"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "python-ulid>=3.0",
    "dnspython>=2.7",
    "httpx>=0.27",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scanners", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "cli", "scanners"]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
