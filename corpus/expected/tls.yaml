# The known-correct answers per case: check_id + location pairs.
#
# Several of these surface as `suspected` rather than a claim, because they
# rest on a single independence class. `expiring-soon` is arithmetic on one
# certificate field and nothing else can corroborate it; `untrusted-root` and
# `chain-incomplete` are only knowable from path building. They are listed
# anyway: docs/10-measurement.md excuses a hedged finding from both true
# positives and false negatives, so listing records what is true without
# distorting the gate, and each entry starts counting the day a second
# independent signal exists.

healthy: []
expired:
  - { check_id: tls-cert-expired, location: "localhost:14401" }
expiring-soon:
  - { check_id: tls-cert-expiring-soon, location: "localhost:14402" }
expiring-urgent:
  - { check_id: tls-cert-expiring-soon, location: "localhost:14403" }
not-yet-valid:
  - { check_id: tls-cert-not-yet-valid, location: "localhost:14404" }
wrong-hostname:
  - { check_id: tls-hostname-mismatch, location: "localhost:14405" }
self-signed:
  - { check_id: tls-cert-self-signed, location: "localhost:14406" }
untrusted-root:
  - { check_id: tls-untrusted-root, location: "localhost:14407" }
weak-key:
  - { check_id: tls-weak-key, location: "localhost:14408" }
sha1-signature:
  - { check_id: tls-cert-self-signed, location: "localhost:14409" }
  - { check_id: tls-weak-signature, location: "localhost:14409" }
incomplete-chain:
  - { check_id: tls-chain-incomplete, location: "localhost:14410" }
no-forward-secrecy:
  - { check_id: tls-no-forward-secrecy, location: "localhost:14411" }
obsolete-protocol:
  - { check_id: tls-protocol-obsolete, location: "localhost:14412" }
unreachable: []
expired-and-incomplete-chain:
  - { check_id: tls-cert-expired, location: "localhost:14414" }
  - { check_id: tls-chain-incomplete, location: "localhost:14414" }
beast-vulnerable:
  - { check_id: tls-protocol-obsolete, location: "localhost:14415" }
  - { check_id: tls-vuln-beast, location: "localhost:14415" }
  - { check_id: tls-no-forward-secrecy, location: "localhost:14415" }
# D48: CN-only leaf. A mismatch under RFC 9525, for our matcher and OpenSSL's.
cn-only:
  - { check_id: tls-hostname-mismatch, location: "localhost:14416" }
# D20, real recordings against public badssl.com weak endpoints - the local
# lab cannot serve any of these (compiled out of OpenSSL 3.5, same wall D11
# hit). rc4/3des/dh512.badssl.com serve *only* their legacy cipher, so our own
# engine's handshake fails outright and tls-no-handshake also fires; that is
# expected and is why it is not listed here as a false positive - `source:
# frozen` and `expect_inconclusive` are separate axes, and tls-no-handshake is
# excluded from `test_every_tls_check_has_a_corpus_case`'s coverage set by
# construction (it can never be a claim).
legacy-cipher-rc4:
  - { check_id: tls-vuln-rc4, location: "rc4.badssl.com:443" }
legacy-cipher-sweet32:
  - { check_id: tls-vuln-sweet32, location: "3des.badssl.com:443" }
legacy-cipher-logjam:
  - { check_id: tls-vuln-logjam, location: "dh512.badssl.com:443" }
legacy-cipher-clean: []
