# Known-correct answers per case: check_id + location pairs that must be
# reported as confirmed or highly_likely. An empty list means the case must
# report NO security finding at all (informational discovery is not listed —
# it is excluded from the gate by design).

# Report nothing: correctly configured, or no real asset behind the name.
known-good: []
takeover-negative: []
wildcard-zone: []

# Discovery only — subdomains are contributed to the asset graph as
# informational inventory; no security finding is expected. enum-cname also
# covers CNAME'd subdomains (a resolving CNAME is a live owned name that must
# be contributed; its third-party target stays a related asset only).
enum-basic: []
enum-cname: []

# The one validated claim the gate rests on: an unsigned delegation, confirmed
# by an independent second resolver agreeing no DS/DNSKEY is served.
dnssec-insecure:
  - { check_id: dnssec-status, location: "$" }

# subdomain-takeover fires as an honest `suspected` finding (a takeover is
# never proven by taking it), which is excused from the gate on both sides, so
# it is not listed as an expected reported-positive. Listed here as a note:
#   takeover-positive  -> subdomain-takeover@gone.corpus-takeover.test (suspected)
#   takeover-secret    -> subdomain-takeover@docs.corpus-takesecret.test (suspected)
#                         secret-exposed@http://docs.corpus-takesecret.test/ (suspected,
#                         ADR-029; asserted by tests/contract/test_secret_exposure_contract.py)
takeover-positive: []
takeover-secret: []

# All sources fail: every check must resolve to inconclusive, asserted via
# expect_inconclusive rather than as a reported finding.
servfail: []

# D28: real registries, recorded 2026-10-10. Expiry read and not near; both
# apexes are DNSSEC-signed (DS and DNSKEY present, hand-verified with dig), so
# nothing is claimed. See corpus/targets/domscout.yaml for the dates.
real-verisign: []
real-pir: []
real-nixi: []

# D53: www.nixi.in is inside the signed zone nixi.in. Nothing may be claimed:
# a dnssec-status claim here is the false claim D53 fixed.
real-subdomain-signed: []
