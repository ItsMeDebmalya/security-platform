# The known-correct answers per case: check_id + location pairs that must be
# reported as confirmed or highly_likely. An empty list means the case must
# report nothing at all.

known-good: []
null-mx: []

# Relaxed alignment is the RFC default and a legitimate choice. The scanner
# says so as an informational finding, which docs/10-measurement.md excludes
# from the gate entirely - it is not a vulnerability claim.
dmarc-relaxed-alignment: []

# No MX records, so mta-sts-missing and tls-rpt-missing are informational, not
# claims (D47, 2026-10-08): RFC 8461 is written in terms of MX hosts, and
# advising MTA-STS for a domain that publishes none is bad advice.
nothing-configured:
  - { check_id: spf-missing, location: "$" }
  - { check_id: dmarc-missing, location: "$" }
  - { check_id: mx-missing, location: "$" }
  - { check_id: spoofing-possible, location: "$" }

dmarc-monitoring-only:
  - { check_id: dmarc-policy-none, location: "$" }
  - { check_id: spoofing-possible, location: "$" }

dmarc-partial-rollout:
  - { check_id: dmarc-pct-partial, location: "$" }
  - { check_id: spoofing-possible, location: "$" }

dmarc-no-reporting:
  - { check_id: dmarc-no-rua, location: "$" }

dmarc-malformed:
  - { check_id: dmarc-invalid, location: "$" }
  - { check_id: spoofing-possible, location: "$" }

spf-invalid:
  - { check_id: spf-invalid, location: "$" }

spf-duplicate:
  - { check_id: spf-multiple-records, location: "$" }

spf-permissive:
  - { check_id: spf-too-permissive, location: "$" }
  - { check_id: spoofing-possible, location: "$" }

spf-lookup-limit:
  - { check_id: spf-lookup-limit, location: "$" }

dkim-weak-key:
  - { check_id: dkim-weak-key, location: "$" }

no-transport-security:
  - { check_id: mta-sts-missing, location: "$" }
  - { check_id: tls-rpt-missing, location: "$" }

# The selector search failed. The correct answer is "we could not tell",
# which is an inconclusive finding and no claim at all.
dkim-not-discoverable: []

servfail: []

# icicibank.com: 8.8.8.8 (primary here) served the TXT set without SPF. The SPF
# record exists (1.1.1.1, 9.9.9.9, and 8.8.8.8 on retry), and DMARC is p=reject,
# so spf-missing and spoofing-possible are false and must not be claimed. The
# true claims: a 1024-bit key at k1 and s2, no MTA-STS, no TLS-RPT.
disagree-stale-spf:
  - { check_id: dkim-weak-key, location: "$" }
  - { check_id: mta-sts-missing, location: "$" }
  - { check_id: tls-rpt-missing, location: "$" }

# flipkart.com: 9.9.9.9 (primary here) still served a 2048-bit key at s1 that
# no longer exists. The weak-key claim rests on mandrill (1024 bits, every
# resolver agrees). DMARC is p=quarantine.
disagree-stale-dkim:
  - { check_id: dkim-weak-key, location: "$" }
  - { check_id: mta-sts-missing, location: "$" }
  - { check_id: tls-rpt-missing, location: "$" }

