# Ground-truth corpus for the Email Security Scanner.
#
# Every case is a synthetic zone recorded by corpus/generators/email.py.
# Re-generate with: uv run python -m corpus.generators.email
#
# Gate from docs/03-roadmap.md and docs/05-phase-1-first-tools.md.

gate:
  precision: 0.99
  recall: 0.95
  inconclusive_max: 0.15
  recall_definition: absolute  # the check set is finite and RFC-defined per domain

cases:
  # --- known-good: anything reported here is a false positive --------------

  - id: known-good
    tier: known_good
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-good.example }
    fixtures: corpus/fixtures/email/known-good

  - id: null-mx
    tier: known_good
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-nomail.example }
    fixtures: corpus/fixtures/email/null-mx

  - id: dmarc-relaxed-alignment
    tier: known_good
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-relaxed.example }
    fixtures: corpus/fixtures/email/dmarc-relaxed-alignment

  # --- known-vulnerable ----------------------------------------------------

  - id: nothing-configured
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-bare.example }
    fixtures: corpus/fixtures/email/nothing-configured

  - id: dmarc-monitoring-only
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-pnone.example }
    fixtures: corpus/fixtures/email/dmarc-monitoring-only

  - id: dmarc-partial-rollout
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-pct.example }
    fixtures: corpus/fixtures/email/dmarc-partial-rollout

  - id: dmarc-no-reporting
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-norua.example }
    fixtures: corpus/fixtures/email/dmarc-no-reporting

  - id: dmarc-malformed
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-baddmarc.example }
    fixtures: corpus/fixtures/email/dmarc-malformed

  - id: spf-invalid
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-badspf.example }
    fixtures: corpus/fixtures/email/spf-invalid

  - id: spf-duplicate
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-dupspf.example }
    fixtures: corpus/fixtures/email/spf-duplicate

  - id: spf-permissive
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-plusall.example }
    fixtures: corpus/fixtures/email/spf-permissive

  - id: spf-lookup-limit
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-chain.example }
    fixtures: corpus/fixtures/email/spf-lookup-limit

  - id: dkim-weak-key
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-weakdkim.example }
    fixtures: corpus/fixtures/email/dkim-weak-key

  - id: no-transport-security
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-notls.example }
    fixtures: corpus/fixtures/email/no-transport-security

  # --- cases where the correct answer is "we cannot tell" ------------------

  - id: dkim-not-discoverable
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-nodkim.example }
    fixtures: corpus/fixtures/email/dkim-not-discoverable

  - id: servfail
    tier: vulnerable
    source: frozen
    mode: standard
    expect_inconclusive: true
    target: { type: domain, value: corpus-broken.example }
    fixtures: corpus/fixtures/email/servfail

  # ADR-029: a credential in a public TXT record (AWS's documented example key).
  - id: secret-in-txt
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-secret.example }
    fixtures: corpus/fixtures/email/secret-in-txt

  # Review of ADR-029: the same key in an otherwise clean zone, cited by no other finding.
  - id: secret-in-txt-clean
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-secret2.example }
    fixtures: corpus/fixtures/email/secret-in-txt-clean

  # --- second-resolver disagreement, recorded from real resolvers (D39) -----
  # corpus/generators/email_recorded.py, from email live run 1's archived
  # three-resolver measurement. Ground truth hand-verified 2026-10-08 with dig
  # through 1.1.1.1 and 8.8.8.8, and DKIM key sizes with openssl.

  - id: disagree-stale-spf
    tier: real_disagreement
    source: recorded
    mode: standard
    resolvers: ["8.8.8.8", "1.1.1.1"]
    target: { type: domain, value: icicibank.com }
    fixtures: corpus/fixtures/email/disagree-stale-spf

  - id: disagree-stale-dkim
    tier: real_disagreement
    source: recorded
    mode: standard
    resolvers: ["9.9.9.9", "1.1.1.1"]
    target: { type: domain, value: flipkart.com }
    fixtures: corpus/fixtures/email/disagree-stale-dkim

  - id: real-obsolete-pct
    tier: real_recorded
    source: recorded
    mode: standard
    target: { type: domain, value: cloudinary.com }
    fixtures: corpus/fixtures/email/real-obsolete-pct

  # RFC 9989 tags with no real positive found yet (searched: the 45 domains of
  # email live runs 1 and 2). Synthetic until one is; the catalogue says so.
  - id: dmarc-test-mode
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-testmode.example }
    fixtures: corpus/fixtures/email/dmarc-test-mode

  - id: dmarc-np-weaker
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: domain, value: corpus-npweak.example }
    fixtures: corpus/fixtures/email/dmarc-np-weaker

  # A real t=y record: grafana.com, recorded live 2026-10-09 (email v1.4.1,
  # Standard mode, post-D39 so resolver labels are true) and hand-verified
  # with dig at 1.1.1.1, 8.8.8.8 and 9.9.9.9. The only t=y among the 7,967
  # screened domains.
  - id: real-test-mode
    tier: real_recorded
    source: recorded
    mode: standard
    target: { type: domain, value: grafana.com }
    fixtures: corpus/fixtures/email/real-test-mode

