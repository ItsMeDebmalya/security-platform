# Ground-truth corpus for DomScout (Tool 3 — DNS & subdomain enumeration, Light).
#
# Every case is a synthetic zone recorded by corpus/generators/domscout.py.
# Re-generate with: uv run python -m corpus.generators.domscout
#
# What this gate measures, and what it deliberately does NOT (design spec,
# revised recall model):
#
#  * Subdomain enumeration is INFORMATIONAL inventory, not a vulnerability, so
#    it is excluded from precision/recall by design (docs/10-measurement.md).
#    The corpus guards it only against *false discovery* — the known_good and
#    wildcard cases must report and contribute nothing false. Completeness is
#    unknowable on a frozen set and is assessed live against subfinder/crt.sh
#    (a comparison, never a score).
#  * The gate applies only to the real security findings. Only `dnssec-status`
#    reaches a validated `confirmed` claim (independent second resolver); the
#    takeover findings are honest `suspected` and excused from the
#    gate on both sides. Expiry on a `.test` name is `not_applicable` (ADR-032):
#    expiry is proven only by the `real_recorded` cases below. So the number rests on a SMALL claim count — read it
#    with the susp% column, exactly as TLS's is read.
#  * `recall_definition: absolute` refers to the gated security findings, whose
#    answers are knowable per domain. It is NOT a claim about subdomain
#    completeness, which is corpus-relative-at-best and measured live only.

gate:
  precision: 0.95
  recall: 0.80
  inconclusive_max: 0.15
  recall_definition: absolute
  notes:
    - "recall is over the security findings (dnssec/expiry/takeover), not over subdomain discovery"
    - "subdomain enumeration is informational inventory, ungated; completeness is assessed live"

cases:
  # --- known-good / no-false-discovery: anything reported here is an FP -----

  - id: known-good
    tier: known_good
    source: frozen
    mode: light
    target: { type: domain, value: corpus-good.test }
    fixtures: corpus/fixtures/domscout/known-good

  - id: takeover-negative
    tier: known_good
    source: frozen
    mode: light
    target: { type: domain, value: corpus-liveghp.test }
    fixtures: corpus/fixtures/domscout/takeover-negative

  - id: wildcard-zone
    tier: known_good
    source: frozen
    mode: light
    target: { type: domain, value: corpus-wildcard.test }
    fixtures: corpus/fixtures/domscout/wildcard-zone

  # --- discovery exercise (informational only, no security finding) ---------

  - id: enum-basic
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: domain, value: corpus-enum.test }
    fixtures: corpus/fixtures/domscout/enum-basic

  - id: enum-cname
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: domain, value: corpus-cname.test }
    fixtures: corpus/fixtures/domscout/enum-cname

  # --- security findings ----------------------------------------------------

  - id: dnssec-insecure
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: domain, value: corpus-nodnssec.test }
    fixtures: corpus/fixtures/domscout/dnssec-insecure

  - id: takeover-positive
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: domain, value: corpus-takeover.test }
    fixtures: corpus/fixtures/domscout/takeover-positive

  # ADR-029: the dangling subdomain's page also serves a credential (AWS's
  # documented example key), so its receipt must be reported.
  - id: takeover-secret
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: domain, value: corpus-takesecret.test }
    fixtures: corpus/fixtures/domscout/takeover-secret

  # --- inconclusive: the scanner must say "I don't know", not "nothing" -----

  - id: servfail
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: domain, value: corpus-broken.test }
    fixtures: corpus/fixtures/domscout/servfail
    expect_inconclusive: true

  # --- D28: expiry read from real registries (ADR-031) ----------------------
  # Recorded live 2026-10-10 (domscout v1.3.0) through the vendored IANA
  # bootstrap, straight to each registry. Each expiry date hand-verified against
  # `curl -L https://rdap.org/domain/<d>` (the registry rdap.org redirects to):
  #   example.com -> rdap.verisign.com                 2027-08-13
  #   iana.org    -> rdap.publicinterestregistry.org   2027-12-08
  #   nixi.in     -> rdap.nixiregistry.in              2026-12-30
  # No claim is expected. The verdict is judged against today, so nixi.in
  # replays as `domain-expiring` (suspected, excused) from 2026-11-30 and as
  # `domain-expired` after 2026-12-30; tests/scanners/domscout/test_expiry.py
  # asserts only that each expiry is read. crt.sh answered 502 for nixi.in on
  # five tries (recorded as it happened: `subdomains-ct-log` inconclusive).
  - id: real-verisign
    tier: real_recorded
    source: recorded
    mode: light
    target: { type: domain, value: example.com }
    fixtures: corpus/fixtures/domscout/real-verisign

  - id: real-pir
    tier: real_recorded
    source: recorded
    mode: light
    target: { type: domain, value: iana.org }
    fixtures: corpus/fixtures/domscout/real-pir

  - id: real-nixi
    tier: real_recorded
    source: recorded
    mode: light
    target: { type: domain, value: nixi.in }
    fixtures: corpus/fixtures/domscout/real-nixi

  # --- D53: a subdomain inside a signed zone ---------------------------------
  # www.nixi.in, recorded live 2026-10-10 and hand-verified with dig at 1.1.1.1:
  # nixi.in (the SOA owner for www.nixi.in) is signed (DS 31765 8 2, 2 DNSKEYs),
  # and www.nixi.in has no DS or DNSKEY of its own, because it is not a zone cut.
  # dnssec-status used to judge www.nixi.in itself and claimed "not signed" at
  # `confirmed`: a false claim. NIXI's RDAP answers with nixi.in's record.
  - id: real-subdomain-signed
    tier: real_recorded
    source: recorded
    mode: light
    target: { type: domain, value: www.nixi.in }
    fixtures: corpus/fixtures/domscout/real-subdomain-signed
