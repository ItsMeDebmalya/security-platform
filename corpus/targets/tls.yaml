# Ground-truth corpus for the SSL/TLS Analyzer.
#
# Every case is a local TLS server carrying one deliberate defect, recorded by
# corpus/generators/tls.py. Re-generate with:
#
#     uv run python -m corpus.generators.tls
#
# Ports are pinned because a recorded handshake is keyed on host, port and
# servername; an ephemeral port would make every fixture unreplayable the
# moment it was regenerated. Changing the order of the cases changes the ports
# and therefore the fixtures, so append rather than insert.
#
# Most defects are issued by a lab certificate authority trusted at record
# time, so each case produces only its own defect. Minting them self-signed
# instead would bury every case under a self-signed finding.
#
# Gate from docs/03-roadmap.md.

gate:
  precision: 0.98
  recall: 0.95
  inconclusive_max: 0.15
  recall_definition: absolute  # the certificate and protocol surface is finite

cases:
  - id: healthy
    tier: known_good
    source: frozen
    mode: standard
    target: { type: url, value: "https://localhost:14400" }
    fixtures: corpus/fixtures/tls/healthy

  - id: expired
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14401" }
    fixtures: corpus/fixtures/tls/expired

  - id: expiring-soon
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14402" }
    fixtures: corpus/fixtures/tls/expiring-soon

  - id: expiring-urgent
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14403" }
    fixtures: corpus/fixtures/tls/expiring-urgent

  - id: not-yet-valid
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14404" }
    fixtures: corpus/fixtures/tls/not-yet-valid

  - id: wrong-hostname
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14405" }
    fixtures: corpus/fixtures/tls/wrong-hostname

  - id: self-signed
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14406" }
    fixtures: corpus/fixtures/tls/self-signed

  - id: untrusted-root
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14407" }
    fixtures: corpus/fixtures/tls/untrusted-root

  - id: weak-key
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://localhost:14408" }
    fixtures: corpus/fixtures/tls/weak-key

  - id: sha1-signature
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://localhost:14409" }
    fixtures: corpus/fixtures/tls/sha1-signature

  - id: incomplete-chain
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14410" }
    fixtures: corpus/fixtures/tls/incomplete-chain

  - id: no-forward-secrecy
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://localhost:14411" }
    fixtures: corpus/fixtures/tls/no-forward-secrecy

  - id: obsolete-protocol
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://localhost:14412" }
    fixtures: corpus/fixtures/tls/obsolete-protocol

  - id: unreachable
    tier: vulnerable
    source: frozen
    mode: light
    expect_inconclusive: true
    target: { type: url, value: "https://localhost:14413" }
    fixtures: corpus/fixtures/tls/unreachable

  # D17: expired and missing its intermediate at once. OpenSSL reports only
  # its first objection ("certificate has expired"), which previously masked
  # the chain-incompleteness entirely - both must fire now.
  - id: expired-and-incomplete-chain
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14414" }
    fixtures: corpus/fixtures/tls/expired-and-incomplete-chain

  # BEAST (first derived finding, ADR-018): TLS 1.0 negotiating a CBC-mode
  # cipher.
  - id: beast-vulnerable
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://localhost:14415" }
    fixtures: corpus/fixtures/tls/beast-vulnerable

  # D48: the leaf names the host only in its Common Name (no SAN). RFC 9525 §2
  # forbids matching the CN, so both readings must call it a mismatch.
  - id: cn-only
    tier: vulnerable
    source: frozen
    mode: light
    target: { type: url, value: "https://localhost:14416" }
    fixtures: corpus/fixtures/tls/cn-only

  # D20: legacy ciphers via the testssl.sh runtime wrap. RC4/3DES/export are
  # compiled out of OpenSSL 3.5, so nothing local - lab included - can serve
  # one. These four freeze real recordings against public badssl.com weak
  # endpoints (corpus/generators/testssl.py), not the local lab. RC4-only and
  # 3DES-only servers fail our own engine's handshake outright (the same wall
  # D11 hit), which is why these still assert findings even though
  # tls-no-handshake also fires - see scanners/tls/scanner.py's early-return
  # path for standard mode.
  - id: legacy-cipher-rc4
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://rc4.badssl.com" }
    fixtures: corpus/fixtures/tls/legacy-cipher-rc4
    testssl_fixtures: corpus/fixtures/testssl/legacy-cipher-rc4

  - id: legacy-cipher-sweet32
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://3des.badssl.com" }
    fixtures: corpus/fixtures/tls/legacy-cipher-sweet32
    testssl_fixtures: corpus/fixtures/testssl/legacy-cipher-sweet32

  - id: legacy-cipher-logjam
    tier: vulnerable
    source: frozen
    mode: standard
    target: { type: url, value: "https://dh512.badssl.com" }
    fixtures: corpus/fixtures/tls/legacy-cipher-logjam
    testssl_fixtures: corpus/fixtures/testssl/legacy-cipher-logjam

  # Negative control: refuses every legacy suite testssl.sh probes for.
  # Real cert/protocol checks also run and are expected to be clean.
  - id: legacy-cipher-clean
    tier: known_good
    source: frozen
    mode: standard
    target: { type: url, value: "https://mozilla-modern.badssl.com" }
    fixtures: corpus/fixtures/tls/legacy-cipher-clean
    testssl_fixtures: corpus/fixtures/testssl/legacy-cipher-clean
