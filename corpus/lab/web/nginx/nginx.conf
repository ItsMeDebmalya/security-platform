# The web (Tool 4a) corpus lab: one server block per case on *.web.test,
# published on 127.0.0.1 only. `always` matters: without it nginx omits a
# header on 4xx/5xx, and the 404 control is every header claim's validation.
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    ssl_certificate     /certs/web-lab.crt;
    ssl_certificate_key /certs/web-lab.key;

    server { listen 80 default_server; server_name _; return 301 https://$host$request_uri; }

    server { listen 443 ssl; server_name known-good.web.test; root /sites/known-good;
             include /etc/nginx/lab/good-headers.conf; }

    # bare: no security headers, plain HTTP serves content, version exposed.
    server { listen 80; listen 443 ssl; server_name bare.web.test; root /sites/bare;
             server_tokens on; }

    server { listen 443 ssl; server_name hsts-weak.web.test; root /sites/plain;
             add_header Strict-Transport-Security "max-age=300" always;
             add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'" always;
             add_header X-Content-Type-Options "nosniff" always;
             add_header Referrer-Policy "strict-origin-when-cross-origin" always; }

    server { listen 443 ssl; server_name csp-weak.web.test; root /sites/plain;
             add_header Strict-Transport-Security "max-age=31536000" always;
             add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; frame-ancestors 'none'" always;
             add_header X-Content-Type-Options "nosniff" always;
             add_header Referrer-Policy "unsafe-url" always;
             add_header Access-Control-Allow-Origin "*" always; }

    server { listen 443 ssl; server_name csp-meta.web.test; root /sites/csp-meta;
             add_header Strict-Transport-Security "max-age=31536000" always;
             add_header X-Frame-Options "DENY" always;
             add_header X-Content-Type-Options "nosniff" always;
             add_header Referrer-Policy "strict-origin-when-cross-origin" always; }

    server { listen 443 ssl; server_name listing.web.test; root /sites/listing;
             include /etc/nginx/lab/good-headers.conf;
             location /assets/ { autoindex on; } }

    server { listen 443 ssl; server_name mixed-sri.web.test; root /sites/mixed-sri;
             include /etc/nginx/lab/good-headers.conf; }

    server { listen 443 ssl; server_name secret.web.test; root /sites/secret;
             include /etc/nginx/lab/good-headers.conf; }

    server { listen 443 ssl; server_name eol.web.test; root /sites/eol;
             include /etc/nginx/lab/good-headers.conf;
             add_header X-Powered-By "PHP/7.4.33" always; }

    server { listen 443 ssl; server_name django-debug.web.test;
             include /etc/nginx/lab/good-headers.conf;
             location / { proxy_pass http://web-lab-django:8000; proxy_set_header Host $host; } }

    server { listen 443 ssl; server_name pytrace.web.test;
             include /etc/nginx/lab/good-headers.conf;
             location / { proxy_pass http://web-lab-pytrace:8000; proxy_set_header Host $host; } }
}
