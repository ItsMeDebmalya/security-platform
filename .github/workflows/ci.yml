name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you trigger a run by hand from the Actions tab, without pushing a
  # commit. This is how you check the pipeline works at all - D1 in the ledger
  # was open for a week because a workflow that has never run is indistinguishable
  # from one that does not work.
  workflow_dispatch:

# A superseded run tells you nothing. Cancel it rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole suite is ~2 minutes. Ten means something hung; fail rather
    # than burn the month's minutes on it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13.15"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Licence policy
        run: uv run python -m cli.licences

      # Added 2026-10-28 (D77, D91). It audits the LOCKED graph explicitly -
      # pip-audit with no -r audits whatever environment it is in, which is how
      # the first run here reported "no known vulnerabilities" while two sat in
      # ours. Accepted vulnerabilities live in tools/cve-exceptions.yaml with a
      # reason and an expiry; an expired or stale entry fails the build.
      - name: Dependency vulnerabilities
        run: uv run python -m cli.cves

      - name: Unit tests
        run: uv run pytest

      - name: Corpus
        run: uv run python -m cli.corpus --check-baseline

      # The scores, kept whether the gate passed or failed - a red build is
      # exactly when you want to read the numbers rather than re-run locally
      # and hope you reproduced it.
      - name: Keep the corpus scores
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-results
          path: corpus/results/latest.json
          if-no-files-found: warn
