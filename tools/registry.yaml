# Third-party components: what we use, under what licence, and how isolated.
#
# Checked in CI by cli/licences.py, which fails the build on:
#   - a licence not on the approved list (ADR-003)
#   - a copyleft component declared `library` rather than `subprocess`/`service`
#   - a forbidden tool, whatever licence its entry claims
#   - a direct dependency with no entry here
#
# isolation:
#   library    - imported into our process. Permissive licences only.
#   subprocess - executed as a separate binary, output parsed. Never linked.
#   service    - stood up as its own container, talked to over HTTP.
#   data       - a data set rather than code. Its licence still applies.
#
# Transitive dependencies are pinned by uv.lock but not individually licensed
# here; a full transitive sweep is a Phase 6 task.

# --- Python runtime dependencies -------------------------------------------

