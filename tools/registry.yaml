- name: testssl.sh
  version: "3.2.4"
  licence: GPL-2.0-only
  spdx: GPL-2.0-only
  source: https://github.com/drwetter/testssl.sh
  purpose: >-
    a runtime dependency for four Standard-mode TLS checks (tls-vuln-rc4,
    tls-vuln-sweet32, tls-vuln-freak, tls-vuln-logjam) via core/testssl.py -
    ADR-016's amendment (D20), the per-check reversal that ADR originally
    reserved: our own engine's OpenSSL 3.5 has RC4/3DES/export ciphers
    compiled out and cannot probe for them at all. For every other TLS check
    it remains the independent second opinion in the corpus cross-check
    (corpus/crosscheck/testssl.py).
  isolation: subprocess   # GPL: separate process, output parsed. Never imported.
  signed_off_by: satwik
  signed_off_at: 2026-08-24
  reviewed_by: Debmalya Dey
  reviewed_at: 2026-10-09
  review_evidence: "bundled LICENSE file (GNU GPL v2) and the script header ('License: GPLv2') in tools/bin/testssl.sh-3.2.4"

- name: checkdmarc
  version: "6.0.3"
  licence: Apache-2.0
  spdx: Apache-2.0
  source: https://github.com/domainaware/checkdmarc
  purpose: >-
    the independent second opinion in the email live re-verification (ledger
    D35) - SPF, DMARC, MX, MTA-STS and TLS-RPT posture from code we did not
    write. Output only, the testssl.sh cross-check precedent: run as its own
    CLI from a separate virtualenv, never a dependency of ours, never imported.
  isolation: subprocess   # run as a separate command from its own venv; never imported
  note: "Licence read from the installed package metadata on 2026-10-08 (License-Expression: Apache-2.0; classifier Apache Software License; bundled LICENSE is Apache 2.0). Its own dependencies include certifi and publicsuffixlist (MPL-2.0); they live only in checkdmarc's separate venv."
  signed_off_by: Debmalya Dey
  signed_off_at: 2026-10-08

