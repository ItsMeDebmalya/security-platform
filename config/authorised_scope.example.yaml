# WORKED EXAMPLE - this file authorises nothing.
#
# core/authz.py reads config/authorised_scope.yaml, not this file. Copy the
# row you need into that file, replace every value with your own, and commit
# the proof alongside it.
#
# To try it without touching the live file:
#
#   uv run scan run tls --target https://localhost:14400 --mode standard \
#     --replay corpus/fixtures/tls/healthy \
#     --scope-file config/authorised_scope.example.yaml
#
# Every domain below uses the `.example` TLD, which RFC 2606 reserves and
# nobody can ever register. An example that pointed at a real domain would be
# an invitation to scan it.
#
# docs/03-roadmap.md 0b.6: authorisation is gated per check, not per mode.
# Passive is what an ordinary client does; active is deliberately abnormal
# input - offering obsolete protocols or weak/legacy ciphers to see what a
# server will accept, not what it ordinarily negotiates. TLS's eight Light
# checks and three of its six Standard checks read only what an ordinary
# handshake already shows (the same certificate a browser gets) and need no
# row in any mode - `--mode light` above needs no `--scope-file` at all.
# TLS's other three Standard checks (tls-protocol-obsolete, tls-weak-cipher,
# tls-no-forward-secrecy) force that abnormal input, so *Standard* mode
# needs a row - which is what the command above demonstrates. Every email
# check reads only public DNS in every mode, so email needs no row in any
# mode, Standard included - the row below for corpus-pnone.example is kept
# as a worked example of `method: self_owned`, not because a Standard email
# scan requires it any more.
#
# The dates are illustrative and some of them are deliberately in the past.
# Regenerate them; do not copy them.

# ---------------------------------------------------------------------------
# 1. A domain we own, verified by publishing a nonce in its DNS.
#    This is the normal case.
# ---------------------------------------------------------------------------

- authz_id: authz_2026-08-24-001     # unique, and sortable by date. Never reused.
  org_id: org_internal               # on every row from day one, pre-multi-tenancy

  target:
    type: domain                     # domain | url | ip | cidr | repo | cloud_account
    value: acme.example
    wildcard: true                   # true also covers api.acme.example and any
                                     # other subdomain. false covers the exact
                                     # name only - the safer default.
                                     #
                                     # PORTS: a value naming a port authorises
                                     # that SERVICE and nothing else, so
                                     # http://10.0.0.5:3000 does not cover
                                     # :5000 on the same host. A value with no
                                     # port is about the host and covers every
                                     # service on it. Name the port when the
                                     # host runs things you do not control.

  method: dns_txt                    # how control was proven. See docs/09 for the
                                     # method required per target type; IP ranges
                                     # and Deep mode need a signed attestation.

  proof:
    observed: 'sp-verify=7f3a91c4e0b25d8a at _scanverify.acme.example'
    observed_at: 2026-08-24T09:14:00Z
    evidence_file: corpus/authz/acme.example-2026-08-24.txt
    # ^ the actual DNS answer, committed. Without it this row is an assertion,
    #   not a verification.

  verified_at: 2026-08-24
  expires_at: 2026-11-22             # 90 days, no exceptions. Domains change
                                     # hands, and a two-year-old TXT check is
                                     # not evidence about today.
  verified_by: operator:satwik       # a person, or `system` once Phase 6 self-serve
                                     # verification exists

  attestation_ref: null              # signed authorisation document. Required for
                                     # Deep mode and for IP ranges. null otherwise.
  revoked_at: null
  revocation_reason: null

# ---------------------------------------------------------------------------
# 2. Something we authored ourselves. Still an explicit row - docs/09 allows
#    no implicit exemptions, not even for our own synthetic corpus zones.
#    This is the row the command at the top of this file uses.
# ---------------------------------------------------------------------------

- authz_id: authz_2026-08-24-002
  org_id: org_internal
  target: { type: domain, value: corpus-pnone.example, wildcard: false }
  method: self_owned
  proof:
    observed: 'synthetic corpus zone, generated by corpus/generators/email.py'
    observed_at: 2026-08-24T00:00:00Z
    evidence_file: corpus/authz/corpus-pnone.example-2026-08-24.txt
  verified_at: 2026-08-24
  expires_at: 2026-11-22
  verified_by: operator:satwik
  attestation_ref: null

# ---------------------------------------------------------------------------
# 3. A lapsed record. Kept, not deleted - the audit trail is append-only and
#    these are retained for 7 years. Standard mode is denied against it.
# ---------------------------------------------------------------------------

- authz_id: authz_2026-01-10-003
  org_id: org_internal
  target: { type: domain, value: lapsed.example, wildcard: false }
  method: dns_txt
  proof:
    observed: 'sp-verify=1c9d04ab77e6f210 at _scanverify.lapsed.example'
    observed_at: 2026-01-10T11:20:00Z
    evidence_file: corpus/authz/lapsed.example-2026-01-10.txt
  verified_at: 2026-01-10
  expires_at: 2026-04-10             # in the past -> denied until re-verified
  verified_by: operator:satwik
  attestation_ref: null

# ---------------------------------------------------------------------------
# 5. The TLS corpus lab, authorising the command at the top of this file.
#    docs/03-roadmap.md 0b.6: TLS's three protocol/cipher-probing Standard
#    checks force deliberately abnormal input, so this row is required for
#    the Standard-mode command above. It would not be needed to run the
#    same target in Light mode - every Light check is an ordinary handshake.
# ---------------------------------------------------------------------------

- authz_id: authz_2026-08-28-005
  org_id: org_internal
  target: { type: domain, value: localhost, wildcard: false }
  method: self_owned
  proof:
    observed: 'local TLS lab started by corpus/generators/tls.py on this machine'
    observed_at: 2026-08-28T00:00:00Z
    evidence_file: corpus/authz/localhost-2026-08-28.txt
  verified_at: 2026-08-28
  expires_at: 2026-11-26
  verified_by: operator:satwik
  attestation_ref: null

# ---------------------------------------------------------------------------
# 4. A revoked record. Revocation is immediate and cancels running scans via
#    the kill switch. The row stays; only the scanning stops.
# ---------------------------------------------------------------------------

- authz_id: authz_2026-08-02-004
  org_id: org_internal
  target: { type: domain, value: former-client.example, wildcard: false }
  method: dns_txt
  proof:
    observed: 'sp-verify=5b8e2f01a3c94d77 at _scanverify.former-client.example'
    observed_at: 2026-08-02T08:00:00Z
    evidence_file: corpus/authz/former-client.example-2026-08-02.txt
  verified_at: 2026-08-02
  expires_at: 2026-10-31             # still in date, but revocation wins
  verified_by: operator:satwik
  attestation_ref: null
  revoked_at: 2026-08-10
  revocation_reason: engagement ended at the customer's request
